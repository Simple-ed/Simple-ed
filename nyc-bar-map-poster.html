<style>
@page { size: 24in 36in; margin: 0; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

body {
  width: 24in; height: 36in;
  background: #1a1d2e;
  color: #f0e6d3;
  font-family: 'Montserrat', sans-serif;
  overflow: hidden;
  position: relative;
}

.poster {
  width: 24in; height: 36in;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.header {
  text-align: center;
  padding: 0.4in 0.5in 0.2in;
  position: relative;
  z-index: 10;
}
.header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 72pt;
  letter-spacing: 0.18em;
  line-height: 0.9;
  color: #f5e6c8;
  text-shadow: 0 2px 20px rgba(200,160,80,0.4);
}
.header .subtitle {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 16pt;
  color: #c9a96e;
  letter-spacing: 0.2em;
  margin-top: 4px;
}
.divider {
  width: 80%; height: 1px; margin: 0.1in auto;
  background: linear-gradient(90deg, transparent, #c9a96e, transparent);
}

/* ── LEGEND ── */
.legend {
  display: flex; justify-content: center; align-items: center;
  gap: 0.4in; padding: 0.08in 0; font-size: 9pt; color: #c9a96e;
  position: relative; z-index: 10;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend .pin-demo { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .pin-demo.visited { background: #c9a96e; border: 2px solid #c9a96e; }
.legend .pin-demo.unvisited { background: transparent; border: 2px solid #c9a96e; }

/* ── MAP CONTAINER ── */
.map-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}
.map-wrap svg {
  width: 100%; height: 100%;
}

/* ── BAR LABELS ── */
.bar-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 6.5px;
  font-weight: 600;
  fill: #f0e6d3;
  pointer-events: none;
}
.hood-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  fill: rgba(201,169,110,0.35);
  letter-spacing: 0.15em;
  pointer-events: none;
}
.street-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 5px;
  fill: rgba(255,255,255,0.12);
  letter-spacing: 0.08em;
}

/* ── FOOTER ── */
.footer {
  text-align: center; padding: 0.12in;
  font-family: 'Playfair Display', serif;
  font-style: italic; font-size: 9pt;
  color: rgba(201,169,110,0.4);
  position: relative; z-index: 10;
}
</style>
